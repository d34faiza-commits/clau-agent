# Nginx VPS 1 — dashboard CLAU AI (Next.js di 127.0.0.1:3000). docs/security.md §4.
# Pasang: sudo cp scripts/deploy/nginx/clau.conf /etc/nginx/sites-available/clau && sudo nginx -t && sudo systemctl reload nginx
# Header keamanan (CSP, X-Frame-Options, dll.) dikirim oleh Next.js (frontend/next.config.mjs); di sini
# hanya batas request, rate limit, dan penyaringan method/path. HSTS ditambahkan setelah HTTPS aktif.

# Rate limit per IP: 20 request/detik (burst 60) dan maks 30 koneksi bersamaan.
limit_req_zone  $binary_remote_addr zone=clau_req:10m rate=20r/s;
limit_conn_zone $binary_remote_addr zone=clau_conn:10m;

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    server_tokens off;

    # Dashboard hanya dibaca: body request kecil, timeout pendek (lindungi dari slowloris).
    client_max_body_size 16k;
    client_body_buffer_size 16k;
    client_header_buffer_size 1k;
    large_client_header_buffers 4 8k;
    client_body_timeout 10s;
    client_header_timeout 10s;
    send_timeout 30s;
    keepalive_timeout 15s;
    reset_timedout_connection on;

    limit_req zone=clau_req burst=60 nodelay;
    limit_req_status 429;
    limit_conn clau_conn 30;
    limit_conn_status 429;

    # Hanya GET/HEAD: tidak ada form, upload, atau server action di dashboard.
    if ($request_method !~ ^(GET|HEAD)$) {
        return 405;
    }

    # File tersembunyi (.git, .env, .next/cache) tidak pernah dilayani.
    location ~ /\.(?!well-known/) {
        return 404;
    }

    location / {
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Tanpa WebSocket di produksi: jangan teruskan Upgrade dari klien.
        proxy_set_header Connection "";
        proxy_hide_header X-Powered-By;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_send_timeout 30s;
    }
}
