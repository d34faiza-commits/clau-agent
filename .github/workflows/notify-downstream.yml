name: Notify Downstream

# Setelah push ke main, minta clau-ai-marketing (memuat agents sebagai submodule) men-sync submodule sekarang
# (tidak menunggu jadwal harian). Butuh secret SUBMODULE_TOKEN dengan akses
# Contents: write ke repo tujuan; tanpa secret, job dilewati (notice).
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      HAS_TOKEN: ${{ secrets.SUBMODULE_TOKEN != '' }}
      GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
      TARGETS: d34faiza-commits/clau-ai-marketing
    steps:
      - name: Token check
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::SUBMODULE_TOKEN belum diset; downstream tidak dipicu (sync harian tetap jalan bila token ada di repo konsumen)."

      - name: Send repository_dispatch
        if: env.HAS_TOKEN == 'true'
        run: |
          for repo in $TARGETS; do
            gh api "repos/$repo/dispatches" -f event_type=submodule-updated \
              -f "client_payload[source]=${{ github.repository }}" \
              -f "client_payload[sha]=${{ github.sha }}"
            echo "dispatched submodule-updated -> $repo"
          done
