name: Sync Submodules

# Harian + manual + dipicu repo upstream (repository_dispatch "submodule-updated").
# Butuh secret SUBMODULE_TOKEN (fine-grained PAT, lihat SUBMODULE.md): GITHUB_TOKEN
# bawaan tidak bisa membaca repo private lain. Tanpa secret, job dilewati (notice).
# Token juga butuh izin Pull requests: Read and write (PR sync ke main yang terproteksi).
on:
  schedule:
    - cron: "17 22 * * *" # 06.17 WITA
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-updated]

# checks/statuses: baca hasil CI PR sync pakai GITHUB_TOKEN (PAT fine-grained tidak bisa).
permissions:
  contents: read
  checks: read
  statuses: read

concurrency:
  group: sync-submodules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      HAS_TOKEN: ${{ secrets.SUBMODULE_TOKEN != '' }}
    steps:
      - name: Token check
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::SUBMODULE_TOKEN belum diset; sync dilewati. Lihat SUBMODULE.md §Setup GitHub Actions."

      - name: Checkout (with submodules)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        if: env.HAS_TOKEN == 'true'
        run: |
          python -m pip install jsonschema==4.26.0
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi

      # main terproteksi (wajib PR + CI hijau): bump di-push ke branch bot lalu dibuka sebagai PR.
      - name: Sync, validate, commit, push to bot branch
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-submodules.sh --pr-branch bot/sync-submodules

      - name: Open PR (auto-merge after CI)
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          base="${{ github.event.repository.default_branch }}"
          if [ -z "$(git log --oneline "origin/$base..HEAD")" ]; then
            echo "tidak ada bump; tidak ada PR"
            exit 0
          fi
          if [ "$(gh pr list --head bot/sync-submodules --base "$base" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base "$base" --head bot/sync-submodules \
              --title "chore: sync submodules" \
              --body "Bump otomatis submodule ke commit terbaru (validator sudah lulus di workflow sync). Merge otomatis setelah CI hijau bila auto-merge aktif."
          fi
          # Merge hanya setelah semua check wajib di head PR hijau. GitHub Free tidak memaksa
          # proteksi di repo private, jadi gh pr merge langsung me-merge: tunggu CI di sini.
          # Check run dibaca pakai GITHUB_TOKEN (checks: read); SUBMODULE_TOKEN tidak punya izin itu.
          # Daftar check sama dengan main-guard.yml dan core/AI-BOUNDARY.md (Disiplin Push).
          required="backend frontend audit cross-validate"
          head="$(git rev-parse HEAD)"
          echo "menunggu check wajib ($required) di $head"
          for _ in $(seq 1 75); do
            runs="$(GH_TOKEN="${{ github.token }}" gh api "repos/${{ github.repository }}/commits/$head/check-runs?per_page=100" \
              --jq '.check_runs[] | [.name, .status, (.conclusion // "")] | @tsv')"
            state=ok
            for check in $required; do
              rows="$(awk -F'\t' -v n="$check" '$1 == n' <<<"$runs")"
              if grep -qE $'\t(failure|cancelled|timed_out|action_required|startup_failure|stale)$' <<<"$rows"; then
                printf '%s\n' "$runs"
                echo "::error::Check $check gagal di PR sync; PR tidak di-merge. Periksa PR bot/sync-submodules."
                exit 1
              fi
              grep -qE $'\tcompleted\tsuccess$' <<<"$rows" || state=wait
            done
            [ "$state" = ok ] && break
            sleep 20
          done
          if [ "$state" != ok ]; then
            printf '%s\n' "$runs"
            echo "::error::Check wajib belum hijau setelah 25 menit; PR sync tidak di-merge."
            exit 1
          fi
          echo "semua check wajib hijau; merge PR sync"
          gh pr merge bot/sync-submodules --auto --merge \
            || gh pr merge bot/sync-submodules --merge
