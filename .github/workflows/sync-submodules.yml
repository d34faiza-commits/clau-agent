name: Sync Submodules

# Harian + manual + dipicu repo upstream (repository_dispatch "submodule-updated").
# Butuh secret SUBMODULE_TOKEN (fine-grained PAT, lihat SUBMODULE.md): GITHUB_TOKEN
# bawaan tidak bisa membaca repo private lain. Tanpa secret, job dilewati (notice).
# Token juga butuh izin Pull requests: Read and write (PR sync ke main yang terproteksi).
on:
  schedule:
    - cron: "17 22 * * *" # 06.17 WITA
  workflow_dispatch:
  repository_dispatch:
    types: [submodule-updated]

permissions:
  contents: read

concurrency:
  group: sync-submodules
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      HAS_TOKEN: ${{ secrets.SUBMODULE_TOKEN != '' }}
    steps:
      - name: Token check
        if: env.HAS_TOKEN != 'true'
        run: echo "::notice::SUBMODULE_TOKEN belum diset; sync dilewati. Lihat SUBMODULE.md §Setup GitHub Actions."

      - name: Checkout (with submodules)
        if: env.HAS_TOKEN == 'true'
        uses: actions/checkout@v7
        with:
          token: ${{ secrets.SUBMODULE_TOKEN }}
          submodules: recursive
          fetch-depth: 0

      - name: Set up Python
        if: env.HAS_TOKEN == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install validator dependencies
        if: env.HAS_TOKEN == 'true'
        run: |
          python -m pip install jsonschema==4.26.0
          if [ -f backend/requirements.txt ]; then python -m pip install -r backend/requirements.txt; fi

      # main terproteksi (wajib PR + CI hijau): bump di-push ke branch bot lalu dibuka sebagai PR.
      - name: Sync, validate, commit, push to bot branch
        if: env.HAS_TOKEN == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          bash scripts/sync-submodules.sh --pr-branch bot/sync-submodules

      - name: Open PR (auto-merge after CI)
        if: env.HAS_TOKEN == 'true'
        env:
          GH_TOKEN: ${{ secrets.SUBMODULE_TOKEN }}
        run: |
          base="${{ github.event.repository.default_branch }}"
          if [ -z "$(git log --oneline "origin/$base..HEAD")" ]; then
            echo "tidak ada bump; tidak ada PR"
            exit 0
          fi
          if [ "$(gh pr list --head bot/sync-submodules --base "$base" --state open --json number --jq length)" = "0" ]; then
            gh pr create --base "$base" --head bot/sync-submodules \
              --title "chore: sync submodules" \
              --body "Bump otomatis submodule ke commit terbaru (validator sudah lulus di workflow sync). Merge otomatis setelah CI hijau bila auto-merge aktif."
          fi
          # Tanpa proteksi aktif, --auto ditolak karena PR bisa langsung di-merge: merge biasa.
          gh pr merge bot/sync-submodules --auto --merge \
            || gh pr merge bot/sync-submodules --merge \
            || echo "::notice::PR sync menunggu CI; aktifkan Settings → General → Allow auto-merge agar ter-merge otomatis."
