# Update keamanan dependency otomatis (docs/security.md §5). Dependabot membuka PR; CI harus hijau
# sebelum merge, dan owner tetap yang memutuskan merge. Update mayor (mis. TypeScript 5 -> 7) tidak dibuka
# otomatis: dikerjakan sebagai PR tersendiri setelah diuji (docs/security.md § 5).
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    ignore:
      # Versi mayor tidak otomatis: diuji dan dikerjakan sengaja (keputusan owner 2026-10-09).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
    groups:
      frontend-minor:
        update-types: [minor, patch]
  - package-ecosystem: pip
    directory: /backend
    schedule:
      interval: weekly
    ignore:
      # Versi mayor tidak otomatis: diuji dan dikerjakan sengaja (keputusan owner 2026-10-09).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 5
  # Base image Docker (dipin ke digest) di backend/Dockerfile dan frontend/Dockerfile.
  - package-ecosystem: docker
    directories: [/backend, /frontend]
    schedule:
      interval: weekly
    ignore:
      # Versi mayor (mis. Python 3.13, Node 24) tidak otomatis (keputusan owner 2026-10-09).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    ignore:
      # Versi mayor tidak otomatis: diuji dan dikerjakan sengaja (keputusan owner 2026-10-09).
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
